// Gradle init script: signs release builds using env vars set by the workflow.
allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('com.android.application') && System.getenv('KEYSTORE_PATH')) {
            def release = p.android.signingConfigs.create('release')
            release.storeFile = new File(System.getenv('KEYSTORE_PATH'))
            release.storePassword = System.getenv('KEYSTORE_PASSWORD')
            release.keyAlias = System.getenv('KEY_ALIAS')
            release.keyPassword = System.getenv('KEY_PASSWORD')
            p.android.buildTypes.release.signingConfig = release
        }
    }
}
