name: Build Android store release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Positive version code; increase for every store update'
        required: true
        default: '1'
        type: string
      version_name:
        description: 'Public version, for example 1.0.0'
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:
  android-store-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Validate version and require signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          case "$IN_CODE" in ''|*[!0-9]*) echo "Version code must be a whole number"; exit 1;; esac
          case "$IN_NAME" in ''|*[!0-9A-Za-z._-]*) echo "Invalid version name"; exit 1;; esac
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production web app (live ads)
        run: pnpm exec vite build --mode production

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Android project
        run: |
          if [ ! -d android ]; then pnpm exec cap add android; fi

      - name: Install native device-stats plugin
        run: |
          DEST=android/app/src/main/java/com/tuneup/optimizer
          mkdir -p "$DEST"
          cp native/android/*.java "$DEST/"

      - name: Set app version
        env:
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $IN_CODE/" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"$IN_NAME\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Generate app icons
        run: |
          pnpm add -D sharp
          node scripts/make-icons.mjs
          find android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Add AdMob app id and permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          APP_ID="ca-app-pub-2832761207597793~5525147546"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" "$MANIFEST"
          fi
          if ! grep -q "permission.AD_ID" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application#' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build release APK and Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign and verify artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          KS="$RUNNER_TEMP/release.jks"
          mkdir -p store-artifacts

          APK_IN=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$BT/zipalign" -f -P 16 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "store-artifacts/TuneUp-$IN_NAME-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "store-artifacts/TuneUp-$IN_NAME-release.apk"

          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$KS" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" "store-artifacts/TuneUp-$IN_NAME-play-release.aab"

          echo "Signing certificate fingerprint (must match Play Console):"
          keytool -list -v -keystore "$KS" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA1|SHA256"

      - name: Upload store artifacts only (never signing keys)
        uses: actions/upload-artifact@v6
        with:
          name: TuneUp-${{ inputs.version_name }}-store-release
          path: store-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
