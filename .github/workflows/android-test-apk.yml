name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app (Google test ads)
        run: pnpm exec vite build --mode test

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create Android project
        run: |
          if [ ! -d android ]; then pnpm exec cap add android; fi

      - name: Install native device-stats plugin
        run: |
          DEST=android/app/src/main/java/com/tuneup/optimizer
          mkdir -p "$DEST"
          cp native/android/*.java "$DEST/"

      - name: Generate app icons
        run: |
          pnpm add -D sharp
          node scripts/make-icons.mjs
          find android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Add AdMob test app id and permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          APP_ID="ca-app-pub-3940256099942544~3347511713"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n    </application>#" "$MANIFEST"
          fi
          if ! grep -q "permission.AD_ID" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application#' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TuneUp-test-ads.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: TuneUp-test-ads
          path: TuneUp-test-ads.apk
          if-no-files-found: error
          retention-days: 14
